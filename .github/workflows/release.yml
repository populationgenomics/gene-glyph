name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing: the npm CLI exchanges this job's OIDC token for a short-lived
      # publish token and attaches a provenance attestation. No NPM_TOKEN secret is involved;
      # the trusted publisher (this repo + release.yml) is configured on npmjs.com.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1; Node 24 bundles a new enough npm.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          publish-script: npm run release
          version-script: npm run version-packages
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
