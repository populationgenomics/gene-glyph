name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  # Artifact Registry npm repository in aasgard-dev: anyone can read; only the publisher
  # service account can write, reached through Workload Identity Federation.
  REGISTRY: https://australia-southeast1-npm.pkg.dev/aasgard-dev/npm/

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/244378007039/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: gene-glyph-publisher@aasgard-dev.iam.gserviceaccount.com
          token_format: access_token
          # Only the token output is used. A credentials file would land in the workspace, and
          # changesets commits the workspace into the release PR.
          create_credentials_file: false

      # Writes an .npmrc mapping @populationgenomics to the registry, authenticated by NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: ${{ env.REGISTRY }}
          scope: '@populationgenomics'

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          publish-script: npm run release
          version-script: npm run version-packages
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          NODE_AUTH_TOKEN: ${{ steps.gcp.outputs.access_token }}
