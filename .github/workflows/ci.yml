name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  playwright:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Browsers and their system libraries come with the image, so the job installs nothing from
    # apt. The tag must match @playwright/test in apps/playground/package.json; Dependabot ignores
    # that package so the two move together by hand.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build gene-glyph package
        # The playground imports `@populationgenomics/gene-glyph`; the
        # workspace symlinks point at `packages/gene-glyph/dist/`, so the
        # build has to land before the dev server starts.
        run: npm run build --workspace packages/gene-glyph

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/playground/playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/playground/test-results/
          retention-days: 7
